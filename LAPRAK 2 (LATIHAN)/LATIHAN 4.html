<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>Form Pendaftaran</title>
    </head>
    <body>
        <h1>Form Pendaftaran Mahasiswa</h1>
        
        <form>
            <fieldset>
                <legend>Data Pribadi</legend>
                <p>
                    <label for="nama">Nama Lengkap:</label> <br>
                    <input type="text" id="nama" name="nama">
                </p>

                <p>
                    <label for="email">Email:</label> <br>
                    <input type="email" id="email" name="email">
                </p>

                <p>
                    <label for="Tanggal">Tanggal Lahir:</label> <br>
                    <input type="date" id="Tanggal" name="Tanggal">
                </p>

                <p>
                    <label>jenis kelamin:</label><br>
                    <input type="radio" id="laki-laki" name="jk" value="L">
                    Laki- Laki
                    <input type="radio" id="perempuan" name="jk" value="P">
                    Perempuan
                </p>

                <p>
                    <label for="prodi">Program Studi</label> <br>
                    
                    <select id="prodi" name="prodi">
                        <option value="">
                            --Pilih Program Studi--
                        </option>
                        <option value="PTIK">PTIK</option>
                        <option value="Tekom">Tekom</option>
                    </select>
                </p>

                <p>
                    <label for="alamat">Alamat:</label> <br>
                    <textarea id="alamat" name="alamat" rows="4"></textarea>
                </p>

                <button type="submit">Daftar</button>
                <button type="reset">Reset</button>

            </fieldset>
       
        </form>
    </body>
</html>
